services:
  db:
    image: postgres:15
    container_name: energy_weather_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  init_db:
    build: .
    container_name: energy_weather_init
    command: python -m src.database.init_db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  datamart_job:
    build: .
    container_name: energy_weather_datamart
    command: python -m src.transformation.build_datamart
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      init_db:
        condition: service_completed_successfully
    restart: "no"

  dashboard:
    build: .
    container_name: energy_weather_dashboard
    command: python -m streamlit run src/dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      init_db:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    image: mcuadros/ofelia:latest
    container_name: energy_weather_scheduler
    depends_on:
      - datamart_job
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      ofelia.job-exec.datamart_cron.schedule: "0 5 * * * *"
      ofelia.job-exec.datamart_cron.container: "energy_weather_datamart"

volumes:
  postgres_data:
